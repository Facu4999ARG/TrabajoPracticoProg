<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#5c2ca0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="930" cy="120" r="310" fill="url(#glow)"/>
  <circle cx="150" cy="690" r="260" fill="#ffffff" opacity="0.07"/>
  <circle cx="1080" cy="690" r="170" fill="#000000" opacity="0.08"/>

  <g fill="#ffffff" opacity="0.15">
    <circle cx="130" cy="125" r="12"/>
    <circle cx="200" cy="90" r="8"/>
    <circle cx="1040" cy="285" r="10"/>
    <circle cx="1100" cy="350" r="7"/>
    <circle cx="260" cy="650" r="9"/>
    <circle cx="950" cy="635" r="12"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="240" y="130" width="720" height="540" rx="82" fill="#ffffff" opacity="0.15"/>
    <rect x="265" y="155" width="670" height="490" rx="68" fill="#111111" opacity="0.10"/>
  </g>

  <text x="600" y="475" text-anchor="middle" font-size="250"
        font-family="Segoe UI Emoji, Apple Color Emoji, Noto Color Emoji, sans-serif">👨‍💻</text>

  <text x="350" y="290" text-anchor="middle" font-size="105"
        font-family="Segoe UI Emoji, Apple Color Emoji, Noto Color Emoji, sans-serif">💻</text>

  <text x="850" y="595" text-anchor="middle" font-size="105"
        font-family="Segoe UI Emoji, Apple Color Emoji, Noto Color Emoji, sans-serif">👩‍💻</text>
</svg>