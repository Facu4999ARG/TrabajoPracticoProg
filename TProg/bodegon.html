<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva - BODEGÓN FAMILIAR</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="Reservacss.css">
</head>
<body data-restaurante="bodegon">
    <header>
        <h1>BODEGÓN FAMILIAR</h1>
        <button class="menu-toggle" type="button" aria-label="Abrir menú" aria-expanded="false">☰</button>
        <nav>
            <a href="Inicio.html">Inicio</a>
            <a href="Catalogo.html">Catálogo</a>
            <a href="conocenos.html">Conócenos</a>
        </nav>
    </header>

    <main>
        <section class="Fotos" aria-label="Galería de BODEGÓN FAMILIAR">
            <img class="FotoPrincipal" src="img/bodegon1.jpg" alt="Vista principal de BODEGÓN FAMILIAR">
            <div class="FotosChicas">
                <img src="img/bodegon2.jpg" alt="Vista del restaurante BODEGÓN FAMILIAR">
                <img src="img/bodegon3.jpg" alt="Otra vista de BODEGÓN FAMILIAR">
            </div>
        </section>

        <section class="Reserva">
            <h1>Reservá tu lugar</h1>
            <form class="Formulario" novalidate>
                <label for="lugares">Personas</label>
                <select id="lugares" name="lugares" required>
                <option value="">Seleccionar...</option>
                <option value="1">1 Persona</option>
                <option value="2">2 Personas</option>
                <option value="3">3 Personas</option>
                <option value="4">4 Personas</option>
                <option value="5">5 Personas</option>
                <option value="6">6 Personas</option>
                <option value="7">7 Personas</option>
                <option value="8">8 Personas</option>
                <option value="9">9 Personas</option>
                <option value="10">10 Personas</option>
                </select>
                <small class="error" id="error-lugares" aria-live="polite"></small>

                <label for="fecha">Fecha</label>
                <input id="fecha" type="date" name="fecha" required>
                <small class="error" id="error-fecha" aria-live="polite"></small>

                <span>Hora</span>
                <div class="horas">
                <label><input type="radio" name="hora" value="11:00"> 11:00</label>
                <label><input type="radio" name="hora" value="12:00"> 12:00</label>
                <label><input type="radio" name="hora" value="13:00"> 13:00</label>
                <label><input type="radio" name="hora" value="14:00"> 14:00</label>
                </div>
                <small class="error" id="error-hora" aria-live="polite"></small>

                <label for="nombre">Nombre</label>
                <input id="nombre" type="text" name="nombre" required>
                <small class="error" id="error-nombre" aria-live="polite"></small>

                <label for="apellido">Apellido</label>
                <input id="apellido" type="text" name="apellido" required>
                <small class="error" id="error-apellido" aria-live="polite"></small>

                <label for="correo">Correo</label>
                <input id="correo" type="email" name="correo" required>
                <small class="error" id="error-correo" aria-live="polite"></small>

                <div class="botones">
                    <button type="submit">Reservar</button>
                    <button type="button" id="btnmisreservas">Mis Reservas</button>
                    <button type="button" id="btnmodificar" style="display:none">Modificar Reserva</button>
                    <button type="button" id="btneliminar" style="display:none">Eliminar Reserva</button>
                </div>

                <div id="listareservas"></div>
            </form>
        </section>
    </main>

    <footer><p>BODEGÓN FAMILIAR</p></footer>
    <script src="menu.js"></script>
    <script src="ReservaJava.js"></script>
</body>
</html>
