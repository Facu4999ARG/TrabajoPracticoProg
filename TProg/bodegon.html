<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva - Sushi</title>
    <link rel="stylesheet" href="Reservacss.css">
</head>

<body>

    <header>
        <h1>TamagoSushi</h1>
    </header>

    <nav>
        <a href="Inicio.html">Inicio</a>
    </nav>

    <main>

    <div class="Fotos">

         <img class="FotoPrincipal" src="https://assets.tmecosys.com/image/upload/t_web_rdp_recipe_584x480/img/recipe/ras/Assets/64EF898D-2EDD-4B47-A456-E6A7D137AC91/Derivates/00f76cac-64f6-4573-be4f-e604a7d99143.jpg">

        <div class="FotosChicas">

         <img src="https://images.unsplash.com/photo-1579871494447-9811cf80d66c">
        
            <img src="https://images.unsplash.com/photo-1553621042-f6e147245754">

        </div>

    </div>
        <section class="Reserva">
            <h1>Reservá tu lugar</h1>
        <form class="Formulario">

            <h2>Personas</h2>
            <select name="lugares">
                <option value="1">1 Persona</option>
                <option value="2">2 Personas</option>
                <option value="3">3 Personas</option>
                <option value="4">4 Personas</option>
            </select>

            <h2>Fecha</h2>
            <input type="date" name="fecha">

            <h2>Hora</h2>
            <div class="horas">
                <label>
            <input type="radio" name="hora" value="12:00" required> 12:00
                </label>

            <label>
            <input type="radio" name="hora" value="13:00"> 13:00
            </label>

            <label>
            <input type="radio" name="hora" value="14:00"> 14:00
            </label>

            </div>

            <h2>Nombre</h2>
            <input type="text" name="nombre">

            <h2>Apellido</h2>
            <input type="text" name="apellido">

            <h2>Correo</h2>
            <input type="email" name="correo">

            <button type="submit">
                Reservar
            </button>

            <button type="button" id="btnmisreservas">
                Mis Reservas
            </button>
            <button type="button" id="btnmodificar" style="display: none;">
               Modificar Reserva
            </button>

            <button type="button" id="btneliminar">
               Eliminar Reserva
            </button>
            <button type="button" id="btneliminar" style="display: none;">
            Eliminar reserva
            </button>

            <div id="listareservas">
                <h2>Mis Reservas</h2>
            </div>

        </form>
        </section>

    </main> 

    <footer>
        <p>TamagoSushi</p>
    </footer>

    <script src="ReservaJava.js"></script>

</body>
</html>
