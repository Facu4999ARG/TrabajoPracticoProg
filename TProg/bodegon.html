<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva - Bodegon</title>
    <link rel="stylesheet" href="Reservacss.css">
</head>

<body data-restaurante="bodegon">

    <header>
        <h1>BODEGON FAMILIAR</h1>
           
        <nav>
            <a href="Inicio.html">Inicio</a>
            <a href="Conocenos.html">Conocenos</a>
            <a href="Catalogo.html">Catalogo</a>
        </nav>
    </header>

   

    <main>

    <div class="Fotos">

         <img class="FotoPrincipal" src="https://offloadmedia.feverup.com/bairessecreta.com/wp-content/uploads/2023/06/28070414/nuestrosecreto-parrilla-buenos-aires-822x1024.jpg">

        <div class="FotosChicas">

         <img src="https://www.clarin.com/img/2022/07/15/i0hUcFJG8_2000x1500__1.jpg">
        
            <img src="https://resizer.glanacion.com/resizer/v2/flan-bodegon-LNLADXTZBZFCFLTEBZBFIOIRDY.jpeg?auth=2fa8c8923cad5fe5ca54cb71054ca93e1c1b2c7da6faa116a2657a1884ad3706&width=420&height=280&quality=70&smart=true">

        </div>

    </div>
        <section class="Reserva">
            <h1>Reservá tu lugar</h1>
        <form class="Formulario">

            <h2>Personas</h2>
            <select name="lugares">
                <option value="1">1 Persona</option>
                <option value="2">2 Personas</option>
                <option value="3">3 Personas</option>
                <option value="4">4 Personas</option>
                <option value="5">5 Persona</option>
                <option value="6">6 Personas</option>
                <option value="7">7 Personas</option>
                <option value="8">8 Personas</option>
                <option value="9">9 Personas</option>
                <option value="10">10 Personas</option>
            </select>

            <h2>Fecha</h2>
            <input type="date" name="fecha" required>

            <h2>Hora</h2>
            <div class="horas">
                    <label>
                     <input type="radio" name="hora" value="11:00" required> 11:00
                </label>
                <label>

            <input type="radio" name="hora" value="12:00" required> 12:00
                </label>

            <label>
            <input type="radio" name="hora" value="13:00"> 13:00
            </label>

            <label>
            <input type="radio" name="hora" value="14:00"> 14:00
            </label>

            </div>

            <h2>Nombre</h2>
            <input type="text" name="nombre">

            <h2>Apellido</h2>
            <input type="text" name="apellido">

            <h2>Correo</h2>
            <input type="email" name="correo">

            <button type="submit">
                Reservar
            </button>

            <button type="button" id="btnmisreservas">
                Mis Reservas
            </button>
            <button type="button" id="btnmodificar" style="display: none;">
               Modificar Reserva
            </button>

            <button type="button" id="btneliminar">
               Eliminar Reserva
            </button>
            <button type="button" id="btneliminar" style="display: none;">
            Eliminar reserva
            </button>

            <div id="listareservas">
                <h2>Mis Reservas</h2>
            </div>

        </form>
        </section>

    </main> 

    <footer>
        <p>Bodegon</p>
    </footer>

    <script src="ReservaJava.js"></script>

</body>
</html>
